<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/head-icon.svg">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="render()">
    <header>
      <div class="headline">
        <img src="./assets/icons/head-icon.svg" alt="Fotogram-logo" />
        <p class="p">Fotogram</p>
      </div>
    </header>
    <main>
      <section class="main-content">
        <div class="gallery">
          <h1>Your personal photo album</h1>
          <div id="img-collectiv"></div>
        </div>
      </section>
    </main>
    <dialog id="imgs-window">
            <div class="dialogBox">
                <header>
                  <p id="imgTitel"></p>
                  <img onclick="closeDialog()" src="./assets/icons/X Button.svg" alt="">
                </header>
                <section id="dialogImg"></section>
                <footer>
                  <button onclick="bLeft()"><img src="./assets/icons/Button left.svg" alt=""></button>
                  <div id="counter"></div>
                  <button onclick="bRight()"><img src="./assets/icons/Button right.svg" alt=""></button>
                </footer>
                </div>
    </dialog>
    <footer>
      <div class="footer-content">
        <div class="footer-top">
          <img src="./assets/icons/DevAka.svg" alt="Developer_Akademie_logo" />
          <div>
            <p>Developer</p>
            <p>Akademie</p>
          </div>
        </div>
        <img
          src="./assets/icons/© 2023 Developer Akademie GmbH.svg"
          alt="Copyright"
        />
      </div>
    </footer>
    <script src="main.js"></script>
  </body>
</html>
